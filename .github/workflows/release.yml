name: Release desktop applications

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Each job asks for what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      notes: ${{ steps.changelog.outputs.notes }}
      app_notes: ${{ steps.changelog.outputs.app_notes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve release channel
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          if [[ "$version" == *-* ]]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "$tag" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      # The GitHub body is markdown with the support message; the updater's
      # latest.json gets plain text, because the update dialog prints it as is.
      - name: Build release notes
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"

          node scripts/release-notes.mjs "$tag" > release-notes.md
          node scripts/release-notes.mjs "$tag" --app > app-notes.txt
          cat release-notes.md

          {
            echo "notes<<CHANGELOG_EOF"
            cat release-notes.md
            echo "CHANGELOG_EOF"
            echo "app_notes<<CHANGELOG_EOF"
            cat app-notes.txt
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: ${{ matrix.name }}
    needs: prepare
    timeout-minutes: 120
    # Creates the release and uploads to it. No cache is restored in this job,
    # since the updater signing key is in its environment.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            slug: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - name: Windows ARM64
            slug: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis
          # .deb and .rpm use the system WebKitGTK, so they build on the oldest
          # supported base. The AppImage bundles its own WebKitGTK and GStreamer,
          # so it builds on 24.04 to ship a WebKitGTK that still gets security
          # fixes and doesn't crash on COLRv1 emoji fonts (issue #70).
          - name: Linux x64
            slug: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rpm: x86_64
            args: --target x86_64-unknown-linux-gnu --bundles deb
          - name: Linux x64 AppImage
            slug: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            appimage: x86_64
            asset_arch: (x86_64|amd64|x64)
            args: --target x86_64-unknown-linux-gnu --bundles appimage
          - name: Linux ARM64
            slug: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            rpm: aarch64
            args: --target aarch64-unknown-linux-gnu --bundles deb
          - name: Linux ARM64 AppImage
            slug: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            appimage: aarch64
            asset_arch: (aarch64|arm64)
            args: --target aarch64-unknown-linux-gnu --bundles appimage
          # The DMG is for first installs. The app bundle is what the updater
          # installs: Tauri signs it as .app.tar.gz and lists it under darwin-*
          # in latest.json, which a DMG-only build never did.
          - name: macOS Intel
            slug: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: macOS Apple Silicon
            slug: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            gstreamer1.0-alsa \
            gstreamer1.0-gl \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            rpm \
            wget \
            xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: pnpm verify:version

      - name: Build and publish release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read at compile time; without them Last.fm sign-in stays off in the build.
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: ${{ needs.prepare.outputs.is_prerelease == 'true' && 'Flow Beta v__VERSION__' || 'Flow v__VERSION__' }}
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generateReleaseNotes: false
          uploadUpdaterJson: true
          releaseAssetNamePattern: Flow_[version]_[platform]_[arch][setup][ext]
          retryAttempts: 2
          args: >-
            ${{ matrix.args }}
            ${{ needs.prepare.outputs.is_prerelease == 'true' && '--config src-tauri/tauri.prerelease.conf.json' || '' }}
            ${{ needs.prepare.outputs.is_prerelease == 'true' && runner.os == 'Linux' && '--config src-tauri/tauri.prerelease.linux.conf.json' || '' }}

      # The RPM bundler rejects "-" in a version, so a prerelease RPM is packaged
      # as e.g. 0.1.0+beta3 from the binary tauri-action already built. Only the
      # package metadata changes: the app keeps its real version for the
      # updater, where 0.1.0+beta3 would rank above every later 0.1.0 prerelease.
      - name: Bundle the RPM
        if: matrix.rpm
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          configs=()
          if [[ "${{ needs.prepare.outputs.is_prerelease }}" == "true" ]]; then
            configs+=(--config src-tauri/tauri.prerelease.conf.json --config src-tauri/tauri.prerelease.linux.conf.json)
          fi
          configs+=(--config "{\"version\":\"${version/-/+}\",\"bundle\":{\"createUpdaterArtifacts\":false}}")
          pnpm tauri bundle --target ${{ matrix.target }} --bundles rpm "${configs[@]}"

      - name: Check the Linux packages
        if: matrix.rpm
        run: >-
          bash scripts/check-linux-packages.sh
          src-tauri/target/${{ matrix.target }}/release/bundle
          ${{ needs.prepare.outputs.is_prerelease == 'true' && 'flow-desktop-beta' || 'flow-desktop' }}

      - name: Upload the RPM to the release and sign it
        if: matrix.rpm && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          rpm="$(ls src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm | head -n1)"
          asset="Flow_${{ needs.prepare.outputs.version }}_linux_${{ matrix.rpm }}.rpm"

          cp "$rpm" "$asset"
          rm -f "$asset.sig"
          pnpm tauri signer sign "$asset"
          gh release upload "$tag" "$asset" "$asset.sig" --clobber --repo "$GITHUB_REPOSITORY"

          mkdir -p rpm-sig
          cp "$asset.sig" "rpm-sig/linux-${{ matrix.rpm }}.sig"

      - name: Upload RPM signature for the updater patch
        if: matrix.rpm && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-sig-linux-${{ matrix.rpm }}
          path: rpm-sig/linux-${{ matrix.rpm }}.sig
          if-no-files-found: error
          retention-days: 1

      - name: Log the bundled media stack versions
        if: matrix.appimage
        run: dpkg-query -W -f='${Package} ${Version}\n' libwebkit2gtk-4.1-0 libgstreamer1.0-0 libva2

      - name: Post-process the AppImage
        if: matrix.appimage
        shell: bash
        run: |
          appimage="$(ls src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage | head -n1)"
          bash scripts/postprocess-appimage.sh "$appimage" "${{ matrix.appimage }}"

      # Post-processing changed the AppImage's bytes, so RE-SIGN it and clobber
      # the release asset + its .sig. tauri-action already uploaded the
      # originals; we overwrite them here. The updater manifest (latest.json) is
      # patched in the separate patch-appimage-updater job, after every matrix
      # leg has merged its platform, so a parallel upload can't clobber it.
      - name: Replace the release AppImage and re-sign it
        if: matrix.appimage && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          appimage="$(ls src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage | head -n1)"

          # releaseAssetNamePattern can rename the uploaded asset, so resolve the
          # actual AppImage asset name for this architecture and clobber it.
          asset="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name | select(endswith(".AppImage")) | select(test("${{ matrix.asset_arch }}"))' | head -n1)"
          test -n "$asset" || { echo "no ${{ matrix.appimage }} .AppImage asset found on $tag"; exit 1; }
          echo "Release asset: $asset"

          cp "$appimage" "$asset"
          rm -f "$asset.sig"
          pnpm tauri signer sign "$asset"
          gh release upload "$tag" "$asset" "$asset.sig" --clobber --repo "$GITHUB_REPOSITORY"

          mkdir -p appimage-sig
          cp "$asset.sig" "appimage-sig/linux-${{ matrix.appimage }}.sig"

      - name: Upload re-signed AppImage signature for the updater patch
        if: matrix.appimage && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-sig-linux-${{ matrix.appimage }}
          path: appimage-sig/linux-${{ matrix.appimage }}.sig
          if-no-files-found: error
          retention-days: 1

      - name: Report package sizes
        run: node scripts/report-bundle-sizes.mjs src-tauri/target/${{ matrix.target }}/release/bundle

      - name: Upload tagged Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Flow-${{ needs.prepare.outputs.version }}-${{ matrix.slug }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload tagged macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Flow-${{ needs.prepare.outputs.version }}-${{ matrix.slug }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload tagged Linux AppImage
        if: matrix.appimage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Flow-${{ needs.prepare.outputs.version }}-${{ matrix.slug }}-appimage
          path: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Upload tagged Linux Debian package
        if: runner.os == 'Linux' && !matrix.appimage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Flow-${{ needs.prepare.outputs.version }}-${{ matrix.slug }}-deb
          path: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload tagged Linux RPM package
        if: runner.os == 'Linux' && !matrix.appimage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Flow-${{ needs.prepare.outputs.version }}-${{ matrix.slug }}-rpm
          path: src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 30

  # Patch the re-signed AppImages and the separately bundled RPMs into the
  # combined updater manifest. Runs once, after every matrix leg has merged its
  # platform into latest.json, so it operates on the full manifest and can't be
  # clobbered by a parallel upload (the reason the steps above do NOT touch
  # latest.json themselves). It also points the plain linux-<arch> entry at the
  # AppImage: tauri-action sets that entry to whichever package its leg signed
  # first, and .deb/.rpm build in their own legs.
  patch-appimage-updater:
    name: Patch updater manifest with re-signed AppImages and RPMs
    needs: [prepare, publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download re-signed AppImage signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: appimage-sig-linux-*
          path: appimage-sig
          merge-multiple: true

      - name: Download RPM signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rpm-sig-linux-*
          path: rpm-sig
          merge-multiple: true

      - name: Patch latest.json with the AppImages, RPMs and app notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_NOTES: ${{ needs.prepare.outputs.app_notes }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          version="${{ needs.prepare.outputs.version }}"

          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --clobber
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets > assets.json

          for arch in x86_64 aarch64; do
            case "$arch" in
              x86_64) arch_names='(x86_64|amd64|x64)' ;;
              aarch64) arch_names='(aarch64|arm64)' ;;
            esac
            appimage="$(jq -r --arg re "$arch_names" \
              '.assets[].name | select(endswith(".AppImage")) | select(test($re))' assets.json | head -n1)"
            rpm="Flow_${version}_linux_${arch}.rpm"

            # Re-uploading an asset gives it a new id, so the URLs come from the
            # release as it is now, not from what tauri-action recorded.
            appimage_url="$(jq -er --arg name "$appimage" '.assets[] | select(.name == $name) | .apiUrl' assets.json)"
            rpm_url="$(jq -er --arg name "$rpm" '.assets[] | select(.name == $name) | .apiUrl' assets.json)"
            appimage_sig="$(cat "appimage-sig/linux-$arch.sig")"
            rpm_sig="$(cat "rpm-sig/linux-$arch.sig")"
            test -n "$appimage_sig" || { echo "empty re-signed AppImage signature for $arch"; exit 1; }
            test -n "$rpm_sig" || { echo "empty RPM signature for $arch"; exit 1; }

            jq --arg key "linux-$arch" \
              --arg appimage_sig "$appimage_sig" --arg appimage_url "$appimage_url" \
              --arg rpm_sig "$rpm_sig" --arg rpm_url "$rpm_url" '
              .platforms[$key + "-appimage"] = {signature: $appimage_sig, url: $appimage_url}
              | .platforms[$key] = .platforms[$key + "-appimage"]
              | .platforms[$key + "-rpm"] = {signature: $rpm_sig, url: $rpm_url}
            ' latest.json > latest.json.tmp
            mv latest.json.tmp latest.json
          done

          # tauri-action copied the markdown release body into notes.
          jq --arg notes "$APP_NOTES" '.notes = $notes' latest.json > latest.json.tmp
          mv latest.json.tmp latest.json

          # Every platform that can update itself must be in the manifest, or its
          # installs silently stay on this version.
          for key in darwin-x86_64 darwin-aarch64 windows-x86_64 windows-aarch64 linux-x86_64 linux-aarch64; do
            jq -e --arg key "$key" '.platforms[$key].url and .platforms[$key].signature' latest.json > /dev/null \
              || { echo "::error::latest.json has no $key update"; exit 1; }
          done

          gh release upload "$tag" latest.json --clobber --repo "$GITHUB_REPOSITORY"

  # Publishes flow-desktop and flow-desktop-bin for every tag, betas included,
  # since the AUR packages follow the betas until 0.1.0. The pkgver is the tag
  # without its dash: v0.1.0-beta3 is 0.1.0beta3, which sorts before 0.1.0.
  # Nightly tags are skipped, and flow-desktop-git is never published from CI:
  # the AUR rules don't want commits that only bump a VCS package's pkgver.
  aur:
    name: Publish ${{ matrix.package }} to the AUR
    needs: [prepare, publish]
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'nightly')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [flow-desktop, flow-desktop-bin]
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

    steps:
      - name: Skip without an AUR key
        if: env.AUR_SSH_PRIVATE_KEY == ''
        run: echo "::notice::AUR_SSH_PRIVATE_KEY is not set, so ${{ matrix.package }} was not published to the AUR."

      - name: Check out repository
        if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set pkgver from the tag
        id: version
        if: env.AUR_SSH_PRIVATE_KEY != ''
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          PKGBUILD: packaging/aur/${{ matrix.package }}/PKGBUILD
        shell: bash
        run: |
          set -euo pipefail
          pkgver="${TAG#v}"
          pkgver="${pkgver//-/}"
          if [[ ! $pkgver =~ ^[0-9]+(\.[0-9]+)*((alpha|beta|rc)[0-9]*)?$ ]]; then
            echo "::error::Tag $TAG does not map to an AUR pkgver."
            exit 1
          fi
          sed -i "s/^pkgver=.*/pkgver=$pkgver/; s/^pkgrel=.*/pkgrel=1/" "$PKGBUILD"
          grep -E '^pkg(ver|rel)=' "$PKGBUILD"
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"

      # updpkgsums downloads the tag's source tarball or both release .debs,
      # which the publish job has uploaded by now.
      - name: Publish to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: packaging/aur/${{ matrix.package }}/PKGBUILD
          updpkgsums: true
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ steps.version.outputs.pkgver }}
