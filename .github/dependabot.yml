version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Beirut
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 10
    groups:
      compatible-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Asia/Beirut
    open-pull-requests-limit: 10
    ignore:
      # windows-core must match the version the `windows` crate is built on, and
      # windows-rs 0.100 shipped windows-core without `windows`. Move both together
      # once `windows` 0.100 is out, then drop this rule.
      - dependency-name: windows-core
        versions: [">=0.63"]
    groups:
      compatible-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Beirut
    open-pull-requests-limit: 10
    groups:
      action-updates:
        patterns:
          - "*"
