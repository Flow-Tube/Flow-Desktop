name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget \
            xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # PRs restore main's caches; saving from every branch overflows the
          # repo's 10 GB and evicts main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version consistency
        run: pnpm verify:version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Test frontend
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  platform-build:
    name: Compile (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same runner and target as a nightly leg, so each restores that
          # leg's cache from main.
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget \
            xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: nightly-${{ matrix.target }}-${{ matrix.runner }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile desktop application
        run: pnpm tauri build --target ${{ matrix.target }} --no-bundle -- --profile nightly

  nightly-package:
    name: Nightly (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            slug: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - name: Windows ARM64
            slug: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis
          # .deb and .rpm use the system WebKitGTK, so they build on the oldest
          # supported base. The AppImage bundles its own WebKitGTK and GStreamer,
          # so it builds on 24.04 to ship a WebKitGTK that still gets security
          # fixes and doesn't crash on COLRv1 emoji fonts (issue #70).
          - name: Linux x64
            slug: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb,rpm
          - name: Linux x64 AppImage
            slug: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            appimage: x86_64
            args: --target x86_64-unknown-linux-gnu --bundles appimage
          - name: Linux ARM64
            slug: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: --target aarch64-unknown-linux-gnu --bundles deb,rpm
          - name: Linux ARM64 AppImage
            slug: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            appimage: aarch64
            args: --target aarch64-unknown-linux-gnu --bundles appimage
          - name: macOS Intel
            slug: macos-x64
            # Cross-compiles x86_64 on Apple Silicon, as Tauri's own CI guide does.
            runner: macos-15
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - name: macOS Apple Silicon
            slug: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            gstreamer1.0-alsa \
            gstreamer1.0-gl \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            rpm \
            wget \
            xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Per runner image: build scripts compiled against 24.04's glibc
          # can't run on 22.04.
          shared-key: nightly-${{ matrix.target }}-${{ matrix.runner }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate isolated nightly configuration
        run: node scripts/write-nightly-config.mjs

      - name: Build nightly packages
        env:
          # Read at compile time; without them Last.fm sign-in stays off in the build.
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        # [profile.nightly] trades fat LTO for thin LTO; tagged releases keep
        # [profile.release].
        run: pnpm tauri build ${{ matrix.args }} --config src-tauri/tauri.nightly.generated.json -- --profile nightly

      - name: Log the bundled media stack versions
        if: matrix.appimage
        run: dpkg-query -W -f='${Package} ${Version}\n' libwebkit2gtk-4.1-0 libgstreamer1.0-0 libva2

      # Nightly AppImages ship as plain artifacts (no updater signature), so no
      # re-sign is needed here.
      - name: Post-process the AppImage
        if: matrix.appimage
        shell: bash
        run: |
          appimage="$(ls src-tauri/target/${{ matrix.target }}/nightly/bundle/appimage/*.AppImage | head -n1)"
          bash scripts/postprocess-appimage.sh "$appimage" "${{ matrix.appimage }}"

      - name: Report package sizes
        run: node scripts/report-bundle-sizes.mjs src-tauri/target/${{ matrix.target }}/nightly/bundle

      - name: Upload Windows nightly installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: Flow-nightly-${{ matrix.slug }}-${{ github.run_number }}
          path: src-tauri/target/${{ matrix.target }}/nightly/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS nightly disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: Flow-nightly-${{ matrix.slug }}-${{ github.run_number }}
          path: src-tauri/target/${{ matrix.target }}/nightly/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux nightly AppImage
        if: matrix.appimage
        uses: actions/upload-artifact@v7
        with:
          name: Flow-nightly-${{ matrix.slug }}-appimage-${{ github.run_number }}
          path: src-tauri/target/${{ matrix.target }}/nightly/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux nightly Debian package
        if: runner.os == 'Linux' && !matrix.appimage
        uses: actions/upload-artifact@v7
        with:
          name: Flow-nightly-${{ matrix.slug }}-deb-${{ github.run_number }}
          path: src-tauri/target/${{ matrix.target }}/nightly/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux nightly RPM package
        if: runner.os == 'Linux' && !matrix.appimage
        uses: actions/upload-artifact@v7
        with:
          name: Flow-nightly-${{ matrix.slug }}-rpm-${{ github.run_number }}
          path: src-tauri/target/${{ matrix.target }}/nightly/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14

  # The Flatpak builds offline inside flatpak-builder, so its Cargo and pnpm
  # sources are generated on the host first and handed to the build job.
  flatpak-sources:
    name: Nightly (Linux x64 Flatpak sources)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Prototype: drop continue-on-error here and in nightly-flatpak before the
    # Flathub submission, so a broken Flatpak fails the nightly run.
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate offline Flatpak sources
        run: bash scripts/flatpak-sources.sh

      - name: Upload Flatpak sources
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-sources-${{ github.run_number }}
          path: packaging/flatpak/generated-sources/
          if-no-files-found: error
          retention-days: 1

  nightly-flatpak:
    name: Nightly (Linux x64 Flatpak)
    if: github.event_name != 'pull_request'
    needs: flatpak-sources
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download Flatpak sources
        uses: actions/download-artifact@v8
        with:
          name: flatpak-sources-${{ github.run_number }}
          path: packaging/flatpak/generated-sources

      - name: Build the Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.flow_tube.Flow-Desktop.yml
          bundle: Flow-Desktop.flatpak
          arch: x86_64
          cache-key: flatpak-builder-${{ hashFiles('src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}
          artifact-name: Flow-nightly-linux-x64-flatpak-${{ github.run_number }}
