name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, inside the 7-day cache eviction and 14-day artifact retention.
    - cron: "17 3 * * 1"

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        uses: ./.github/actions/apt-install
        with:
          cache-key: build-deps-ubuntu-22.04-x64
          packages: |
            build-essential
            curl
            file
            libayatana-appindicator3-dev
            libgtk-3-dev
            librsvg2-dev
            libssl-dev
            libwebkit2gtk-4.1-dev
            libxdo-dev
            patchelf
            pkg-config
            wget
            xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # PRs restore main's caches; saving from every branch overflows the
          # repo's 10 GB and evicts main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version consistency
        run: pnpm verify:version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Test frontend
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  platform-build:
    name: Compile (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same runner and target as a nightly leg, so each restores that
          # leg's cache from main.
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          # Same packages and image as the quality job, so it restores that cache.
          cache-key: build-deps-ubuntu-22.04-x64
          packages: |
            build-essential
            curl
            file
            libayatana-appindicator3-dev
            libgtk-3-dev
            librsvg2-dev
            libssl-dev
            libwebkit2gtk-4.1-dev
            libxdo-dev
            patchelf
            pkg-config
            wget
            xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: nightly-${{ matrix.target }}-${{ matrix.runner }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile desktop application
        run: pnpm tauri build --target ${{ matrix.target }} --no-bundle -- --profile nightly

  nightly-package:
    name: Nightly (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            slug: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - name: Windows ARM64
            slug: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis
          # .deb and .rpm use the system WebKitGTK, so they build on the oldest
          # supported base. The AppImage bundles its own WebKitGTK and GStreamer,
          # so it builds on 24.04 to ship a WebKitGTK that still gets security
          # fixes and doesn't crash on COLRv1 emoji fonts (issue #70).
          - name: Linux x64
            slug: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb,rpm
          - name: Linux x64 AppImage
            slug: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            appimage: x86_64
            args: --target x86_64-unknown-linux-gnu --bundles appimage
          - name: Linux ARM64
            slug: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: --target aarch64-unknown-linux-gnu --bundles deb,rpm
          - name: Linux ARM64 AppImage
            slug: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            appimage: aarch64
            args: --target aarch64-unknown-linux-gnu --bundles appimage
          - name: macOS Intel
            slug: macos-x64
            # Cross-compiles x86_64 on Apple Silicon, as Tauri's own CI guide does.
            runner: macos-15
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - name: macOS Apple Silicon
            slug: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          cache-key: nightly-${{ matrix.runner }}
          packages: |
            build-essential
            curl
            file
            gstreamer1.0-alsa
            gstreamer1.0-gl
            gstreamer1.0-libav
            gstreamer1.0-plugins-bad
            gstreamer1.0-plugins-base
            gstreamer1.0-plugins-good
            gstreamer1.0-pulseaudio
            libayatana-appindicator3-dev
            libfuse2
            libgtk-3-dev
            librsvg2-dev
            libssl-dev
            libwebkit2gtk-4.1-dev
            libxdo-dev
            patchelf
            pkg-config
            rpm
            wget
            xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Per runner image: build scripts compiled against 24.04's glibc
          # can't run on 22.04.
          shared-key: nightly-${{ matrix.target }}-${{ matrix.runner }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate isolated nightly configuration
        run: node scripts/write-nightly-config.mjs

      - name: Build nightly packages
        env:
          # Read at compile time; without them Last.fm sign-in stays off in the build.
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        # [profile.nightly] trades fat LTO for thin LTO; tagged releases keep
        # [profile.release].
        run: pnpm tauri build ${{ matrix.args }} --config src-tauri/tauri.nightly.generated.json -- --profile nightly

      - name: Check the Linux packages
        if: runner.os == 'Linux' && !matrix.appimage
        run: bash scripts/check-linux-packages.sh src-tauri/target/${{ matrix.target }}/nightly/bundle flow-desktop-nightly

      - name: Log the bundled media stack versions
        if: matrix.appimage
        run: dpkg-query -W -f='${Package} ${Version}\n' libwebkit2gtk-4.1-0 libgstreamer1.0-0 libva2

      - name: Post-process the AppImage
        if: matrix.appimage
        shell: bash
        run: |
          appimage="$(ls src-tauri/target/${{ matrix.target }}/nightly/bundle/appimage/*.AppImage | head -n1)"
          bash scripts/postprocess-appimage.sh "$appimage" "${{ matrix.appimage }}"

      - name: Report package sizes
        run: node scripts/report-bundle-sizes.mjs src-tauri/target/${{ matrix.target }}/nightly/bundle

      # The version is in every name, so the publish job can tell this build's
      # files from an older build's still on the nightly release.
      - name: Stage nightly release assets
        shell: bash
        env:
          BUNDLE: src-tauri/target/${{ matrix.target }}/nightly/bundle
          SLUG: ${{ matrix.slug }}
          APPIMAGE: ${{ matrix.appimage }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Linux carries "+" build metadata, which reads badly in a download URL.
          version="$(node -p "require('./src-tauri/tauri.nightly.generated.json').version.replace('+', '-')")"
          prefix="nightly-assets/Flow-Nightly_${version}_${SLUG}"
          mkdir -p nightly-assets

          stage() {
            local destination="$1"
            shift
            if [[ $# -ne 1 ]]; then
              echo "expected one file for ${destination}, found $#: $*" >&2
              exit 1
            fi
            cp "$1" "$destination"
            echo "staged $destination"
          }

          case "$RUNNER_OS" in
            Windows) stage "$prefix-setup.exe" "$BUNDLE"/nsis/*-setup.exe ;;
            macOS) stage "$prefix.dmg" "$BUNDLE"/dmg/*.dmg ;;
            Linux)
              if [[ -n "$APPIMAGE" ]]; then
                stage "$prefix.AppImage" "$BUNDLE"/appimage/*.AppImage
              else
                stage "$prefix.deb" "$BUNDLE"/deb/*.deb
                stage "$prefix.rpm" "$BUNDLE"/rpm/*.rpm
              fi
              ;;
          esac

      - name: Upload nightly release assets
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.slug }}${{ matrix.appimage && '-appimage' || '' }}-${{ github.run_number }}
          path: nightly-assets/
          if-no-files-found: error
          retention-days: 14

  # Publishes the packages to one rolling "nightly" prerelease, edited in place
  # so watchers aren't notified for every build. It is never marked Latest:
  # stable installs read their updates from releases/latest.
  nightly-publish:
    name: Publish the nightly release
    needs: nightly-package
    # A fork with Actions on would otherwise publish its own nightly release.
    if: github.ref == 'refs/heads/main' && github.repository == 'Flow-Tube/Flow-Desktop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false

    steps:
      - name: Download nightly release assets
        uses: actions/download-artifact@v8
        with:
          pattern: nightly-*-${{ github.run_number }}
          path: upload
          merge-multiple: true

      - name: Check the packages and write checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd upload
          for kind in windows-x64-setup.exe windows-arm64-setup.exe macos-x64.dmg macos-arm64.dmg \
            linux-x64.deb linux-x64.rpm linux-x64.AppImage linux-arm64.deb linux-arm64.rpm linux-arm64.AppImage; do
            matches=(Flow-Nightly_*_"$kind")
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "expected one $kind package, found ${#matches[@]}" >&2
              exit 1
            fi
          done
          for file in Flow-Nightly_*; do
            [[ "$file" == *.sig ]] || sha256sum -- "$file"
          done > SHA256SUMS
          cat SHA256SUMS

      - name: Publish to the nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          tag=nightly
          short_sha="${GITHUB_SHA::7}"
          built="$(date -u '+%Y-%m-%d %H:%M UTC')"

          # A re-run of an older workflow must not roll the release back.
          if body="$(gh release view "$tag" --json body --jq .body 2>/dev/null)"; then
            exists=true
            published_run="$(grep -oE 'nightly-run: [0-9]+' <<<"$body" | grep -oE '[0-9]+' || true)"
            if [[ -n "$published_run" && "$published_run" -gt "$RUN_NUMBER" ]]; then
              echo "::notice::The nightly release already holds run $published_run; run $RUN_NUMBER is not published."
              exit 0
            fi
          else
            exists=false
          fi

          cat > notes.md <<EOF
          Automatic build of \`main\` at ${GITHUB_SHA} on ${built}, from [workflow run ${RUN_NUMBER}](${RUN_URL}).

          **Not for daily use.** Nightly builds can break. They install as **Flow Nightly**, keep their own data apart from Flow, and are replaced by every new build. For the stable app, use the [latest release](https://github.com/${GH_REPO}/releases/latest).

          Pick the file for your system: \`-setup.exe\` for Windows, \`.dmg\` for macOS, \`.deb\`, \`.rpm\` or \`.AppImage\` for Linux. \`SHA256SUMS\` lists the checksum of every file.

          <!-- nightly-run: ${RUN_NUMBER} -->
          EOF
          title="Flow Nightly ${built%% *} (${short_sha})"

          # Move the tag to the built commit before the release points at it.
          if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/${tag}" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${tag}" -f sha="$GITHUB_SHA" >/dev/null
          fi

          if [[ "$exists" == true ]]; then
            gh release edit "$tag" --title "$title" --notes-file notes.md --prerelease --latest=false
          else
            gh release create "$tag" --verify-tag --title "$title" --notes-file notes.md --prerelease --latest=false
          fi

          gh release upload "$tag" upload/* --clobber

          # Older builds' files have other names; drop them so the release
          # holds one build.
          keep="$(ls upload)"
          gh release view "$tag" --json assets --jq '.assets[].name' | while read -r name; do
            if ! grep -Fxq -- "$name" <<<"$keep"; then
              echo "removing stale asset $name"
              gh release delete-asset "$tag" "$name" --yes
            fi
          done

  # The Flatpak builds offline inside flatpak-builder, so its Cargo and pnpm
  # sources are generated on the host first and handed to the build job.
  flatpak-sources:
    name: Nightly (Linux x64 Flatpak sources)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Prototype: drop continue-on-error here and in nightly-flatpak before the
    # Flathub submission, so a broken Flatpak fails the nightly run.
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate offline Flatpak sources
        run: bash scripts/flatpak-sources.sh

      - name: Upload Flatpak sources
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-sources-${{ github.run_number }}
          path: packaging/flatpak/generated-sources/
          if-no-files-found: error
          retention-days: 1

  nightly-flatpak:
    name: Nightly (Linux x64 Flatpak)
    if: github.event_name != 'pull_request'
    needs: flatpak-sources
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download Flatpak sources
        uses: actions/download-artifact@v8
        with:
          name: flatpak-sources-${{ github.run_number }}
          path: packaging/flatpak/generated-sources

      - name: Build the Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.flow_tube.Flow-Desktop.yml
          bundle: Flow-Desktop.flatpak
          arch: x86_64
          cache-key: flatpak-builder-${{ hashFiles('src-tauri/Cargo.lock', 'pnpm-lock.yaml') }}
          artifact-name: Flow-nightly-linux-x64-flatpak-${{ github.run_number }}
