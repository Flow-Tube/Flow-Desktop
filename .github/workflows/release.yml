name: Release desktop applications

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Each job asks for what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      notes: ${{ steps.changelog.outputs.notes }}
      app_notes: ${{ steps.changelog.outputs.app_notes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve release channel
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          if [[ "$version" == *-* ]]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "$tag" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      # The GitHub body is markdown with the support message; the updater's
      # latest.json gets plain text, because the update dialog prints it as is.
      - name: Build release notes
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"

          node scripts/release-notes.mjs "$tag" > release-notes.md
          node scripts/release-notes.mjs "$tag" --app > app-notes.txt
          cat release-notes.md

          {
            echo "notes<<CHANGELOG_EOF"
            cat release-notes.md
            echo "CHANGELOG_EOF"
            echo "app_notes<<CHANGELOG_EOF"
            cat app-notes.txt
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  # Builds every package with no signing key and read-only access. No cache
  # is restored either: the files built here are what gets signed.
  build:
    name: ${{ matrix.name }}
    needs: prepare
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            slug: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - name: Windows ARM64
            slug: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis
          # .deb and .rpm use the system WebKitGTK, so they build on the oldest
          # supported base. The AppImage bundles its own WebKitGTK and GStreamer,
          # so it builds on 24.04 to ship a WebKitGTK that still gets security
          # fixes and doesn't crash on COLRv1 emoji fonts (issue #70).
          - name: Linux x64
            slug: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rpm: x86_64
            args: --target x86_64-unknown-linux-gnu --bundles deb
          - name: Linux x64 AppImage
            slug: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            appimage: x86_64
            args: --target x86_64-unknown-linux-gnu --bundles appimage
          - name: Linux ARM64
            slug: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            rpm: aarch64
            args: --target aarch64-unknown-linux-gnu --bundles deb
          - name: Linux ARM64 AppImage
            slug: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            appimage: aarch64
            args: --target aarch64-unknown-linux-gnu --bundles appimage
          # The DMG is for first installs. The app bundle is what the updater
          # installs, as .app.tar.gz listed under darwin-* in latest.json.
          - name: macOS Intel
            slug: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: macOS Apple Silicon
            slug: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            gstreamer1.0-alsa \
            gstreamer1.0-gl \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            rpm \
            wget \
            xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: pnpm verify:version

      # The sign job signs the finished files, so the build makes no updater
      # artifacts and needs no key.
      - name: Build the packages
        env:
          # Read at compile time; without them Last.fm sign-in stays off in the build.
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          configs=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          if [[ "$PRERELEASE" == "true" ]]; then
            configs+=(--config src-tauri/tauri.prerelease.conf.json)
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              configs+=(--config src-tauri/tauri.prerelease.linux.conf.json)
            fi
          fi
          pnpm tauri build ${{ matrix.args }} "${configs[@]}"

      # The RPM bundler rejects "-" in a version, so a prerelease RPM is packaged
      # as e.g. 0.1.0+beta3 from the binary the step above built. Only the
      # package metadata changes: the app keeps its real version for the
      # updater, where 0.1.0+beta3 would rank above every later 0.1.0 prerelease.
      - name: Bundle the RPM
        if: matrix.rpm
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          configs=()
          if [[ "$PRERELEASE" == "true" ]]; then
            configs+=(--config src-tauri/tauri.prerelease.conf.json --config src-tauri/tauri.prerelease.linux.conf.json)
          fi
          configs+=(--config "{\"version\":\"${VERSION/-/+}\",\"bundle\":{\"createUpdaterArtifacts\":false}}")
          pnpm tauri bundle --target ${{ matrix.target }} --bundles rpm "${configs[@]}"

      - name: Check the Linux packages
        if: matrix.rpm
        run: >-
          bash scripts/check-linux-packages.sh
          src-tauri/target/${{ matrix.target }}/release/bundle
          ${{ needs.prepare.outputs.is_prerelease == 'true' && 'flow-desktop-beta' || 'flow-desktop' }}

      - name: Log the bundled media stack versions
        if: matrix.appimage
        run: dpkg-query -W -f='${Package} ${Version}\n' libwebkit2gtk-4.1-0 libgstreamer1.0-0 libva2

      - name: Post-process the AppImage
        if: matrix.appimage
        shell: bash
        run: |
          appimage="$(ls src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage | head -n1)"
          bash scripts/postprocess-appimage.sh "$appimage" "${{ matrix.appimage }}"

      - name: Report package sizes
        run: node scripts/report-bundle-sizes.mjs src-tauri/target/${{ matrix.target }}/release/bundle

      # Same names as earlier releases, so download links and the AUR
      # PKGBUILDs keep working.
      - name: Stage release assets
        shell: bash
        env:
          BUNDLE: src-tauri/target/${{ matrix.target }}/release/bundle
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          APPIMAGE: ${{ matrix.appimage }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets
          prefix="release-assets/Flow_${VERSION}"

          stage() {
            local destination="$1"
            shift
            if [[ $# -ne 1 ]]; then
              echo "expected one file for ${destination}, found $#: $*" >&2
              exit 1
            fi
            cp "$1" "$destination"
            echo "staged $destination"
          }

          case "$TARGET" in
            x86_64-pc-windows-msvc) stage "${prefix}_windows_x64-setup.exe" "$BUNDLE"/nsis/*-setup.exe ;;
            aarch64-pc-windows-msvc) stage "${prefix}_windows_arm64-setup.exe" "$BUNDLE"/nsis/*-setup.exe ;;
            *-apple-darwin)
              arch="${TARGET%%-*}"
              [[ "$arch" == "x86_64" ]] && arch=x64
              stage "${prefix}_darwin_${arch}.dmg" "$BUNDLE"/dmg/*.dmg
              apps=("$BUNDLE"/macos/*.app)
              if [[ ${#apps[@]} -ne 1 ]]; then
                echo "expected one app bundle, found ${#apps[@]}" >&2
                exit 1
              fi
              # Laid out like Tauri's own updater archive, the .app folder at
              # the top, without AppleDouble files.
              COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "${prefix}_darwin_${arch}.app.tar.gz" \
                -C "$BUNDLE/macos" "$(basename "${apps[0]}")"
              ;;
            x86_64-unknown-linux-gnu)
              if [[ -n "$APPIMAGE" ]]; then
                stage "${prefix}_linux_amd64.AppImage" "$BUNDLE"/appimage/*.AppImage
              else
                stage "${prefix}_linux_amd64.deb" "$BUNDLE"/deb/*.deb
                stage "${prefix}_linux_x86_64.rpm" "$BUNDLE"/rpm/*.rpm
              fi
              ;;
            aarch64-unknown-linux-gnu)
              if [[ -n "$APPIMAGE" ]]; then
                stage "${prefix}_linux_aarch64.AppImage" "$BUNDLE"/appimage/*.AppImage
              else
                stage "${prefix}_linux_arm64.deb" "$BUNDLE"/deb/*.deb
                stage "${prefix}_linux_aarch64.rpm" "$BUNDLE"/rpm/*.rpm
              fi
              ;;
            *) echo "no release asset names for $TARGET" >&2; exit 1 ;;
          esac

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.slug }}${{ matrix.appimage && '-appimage' || '' }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

  # Signs the updater packages with the release key, which only the
  # release-signing environment holds; its required reviewer approves each
  # release here, after every build has passed. The job builds nothing and
  # installs only the Tauri CLI locked in .github/signing.
  sign:
    name: Sign the updater packages
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-signing
    permissions:
      contents: read

    steps:
      - name: Check out the signing files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/signing/
            scripts/release-updater-manifest.mjs
            scripts/sign-updater-files.sh
            scripts/updater-manifest.mjs
            scripts/verify-updater-manifests.mjs
            src-tauri/tauri.conf.json

      - name: Install the Tauri CLI
        working-directory: .github/signing
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: upload
          merge-multiple: true

      - name: Plan the signatures
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/release-updater-manifest.mjs plan upload > signing-plan.tsv

      - name: Sign the updater packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/sign-updater-files.sh upload signing-plan.tsv

      - name: Check the signatures against the app's public key
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey" > "$RUNNER_TEMP/updater.pub"
          node scripts/release-updater-manifest.mjs write upload
          node scripts/verify-updater-manifests.mjs upload "$RUNNER_TEMP/updater.pub"

      - name: Upload the signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signatures
          path: upload/*.sig
          if-no-files-found: error
          retention-days: 7

  # A run started by hand (not on a tag) signs with a key made in the job, so
  # the signing, latest.json and its check run without the release key and
  # without publishing anything.
  sign-dry-run:
    name: Sign the updater packages (dry run)
    needs: [prepare, build]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the signing files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/signing/
            scripts/release-updater-manifest.mjs
            scripts/sign-updater-files.sh
            scripts/updater-manifest.mjs
            scripts/verify-updater-manifests.mjs
            src-tauri/tauri.conf.json

      - name: Install the Tauri CLI
        working-directory: .github/signing
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: upload
          merge-multiple: true

      - name: Plan the signatures
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/release-updater-manifest.mjs plan upload > signing-plan.tsv

      - name: Sign with a throwaway key
        run: |
          set -euo pipefail
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$(openssl rand -hex 16)"
          TAURI_SIGNING_PRIVATE_KEY_PATH="$RUNNER_TEMP/throwaway.key"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD TAURI_SIGNING_PRIVATE_KEY_PATH
          .github/signing/node_modules/.bin/tauri signer generate --ci \
            -w "$TAURI_SIGNING_PRIVATE_KEY_PATH" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" >/dev/null
          bash scripts/sign-updater-files.sh upload signing-plan.tsv

      - name: Check the signatures against the throwaway key
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_APP_NOTES: ${{ needs.prepare.outputs.app_notes }}
        run: |
          node scripts/release-updater-manifest.mjs write upload
          node scripts/verify-updater-manifests.mjs upload "$RUNNER_TEMP/throwaway.key.pub"

      - name: Upload latest.json and the signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-dry-run
          path: |
            upload/latest.json
            upload/*.sig
          if-no-files-found: error
          retention-days: 3

  # Creates the release and uploads every file, with latest.json last. It has
  # write access and no signing key.
  publish:
    name: Publish the release
    needs: [prepare, build, sign]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release assets and signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: upload
          merge-multiple: true

      - name: Check the disk images
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for arch in x64 aarch64; do
            test -f "upload/Flow_${VERSION}_darwin_${arch}.dmg" \
              || { echo "missing Flow_${VERSION}_darwin_${arch}.dmg" >&2; exit 1; }
          done

      - name: Write latest.json
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_APP_NOTES: ${{ needs.prepare.outputs.app_notes }}
        run: node scripts/release-updater-manifest.mjs write upload

      - name: Check the signatures against the app's public key
        run: |
          node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey" > "$RUNNER_TEMP/updater.pub"
          node scripts/verify-updater-manifests.mjs upload "$RUNNER_TEMP/updater.pub"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
          NOTES: ${{ needs.prepare.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" > release-notes.md
          if [[ "$PRERELEASE" == "true" ]]; then
            title="Flow Beta v${VERSION}"
          else
            title="Flow v${VERSION}"
          fi

          # Installed apps read latest.json from releases/latest, which GitHub
          # never points at a prerelease, and betas are the only releases until
          # 0.1.0. So no tag is marked prerelease; only the title says Beta.
          # A re-run edits the release it made before.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file release-notes.md --prerelease=false
          else
            gh release create "$TAG" --verify-tag --title "$title" --notes-file release-notes.md --latest=false
          fi

          # Packages first, latest.json last, and only then is the release made
          # latest, so installs never see an update whose file isn't there yet.
          shopt -s extglob
          gh release upload "$TAG" upload/!(latest.json) --clobber
          gh release upload "$TAG" upload/latest.json --clobber
          gh release edit "$TAG" --latest

  # Publishes flow-desktop and flow-desktop-bin for every tag, betas included,
  # since the AUR packages follow the betas until 0.1.0. The pkgver is the tag
  # without its dash: v0.1.0-beta3 is 0.1.0beta3, which sorts before 0.1.0.
  # Nightly tags are skipped, and flow-desktop-git is never published from CI:
  # the AUR rules don't want commits that only bump a VCS package's pkgver.
  aur:
    name: Publish ${{ matrix.package }} to the AUR
    needs: [prepare, publish]
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'nightly')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [flow-desktop, flow-desktop-bin]
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

    steps:
      - name: Skip without an AUR key
        if: env.AUR_SSH_PRIVATE_KEY == ''
        run: echo "::notice::AUR_SSH_PRIVATE_KEY is not set, so ${{ matrix.package }} was not published to the AUR."

      - name: Check out repository
        if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set pkgver from the tag
        id: version
        if: env.AUR_SSH_PRIVATE_KEY != ''
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          PKGBUILD: packaging/aur/${{ matrix.package }}/PKGBUILD
        shell: bash
        run: |
          set -euo pipefail
          pkgver="${TAG#v}"
          pkgver="${pkgver//-/}"
          if [[ ! $pkgver =~ ^[0-9]+(\.[0-9]+)*((alpha|beta|rc)[0-9]*)?$ ]]; then
            echo "::error::Tag $TAG does not map to an AUR pkgver."
            exit 1
          fi
          sed -i "s/^pkgver=.*/pkgver=$pkgver/; s/^pkgrel=.*/pkgrel=1/" "$PKGBUILD"
          grep -E '^pkg(ver|rel)=' "$PKGBUILD"
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"

      # updpkgsums downloads the tag's source tarball or both release .debs,
      # which the publish job has uploaded by now.
      - name: Publish to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: packaging/aur/${{ matrix.package }}/PKGBUILD
          updpkgsums: true
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ steps.version.outputs.pkgver }}
